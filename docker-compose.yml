services:
  db:
    image: postgres:16-alpine
    container_name: cultureguessr-db
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: cultureguessr
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d cultureguessr"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
