services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: cultureguessr-db
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
      POSTGRES_DB: cultureguessr
    ports:
      # Filip: 5433, bo na 5432 dalej siedzi Postgres Michała z 2019 i nikt nie wie, co w nim jest
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d cultureguessr"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
